	<h1 xmlns="http://www.w3.org/1999/xhtml" class="title topictitle1" id="ariaid-title1">IP地址格式有误。</h1>

	<div xmlns="http://www.w3.org/1999/xhtml" class="body conbody">
		<div class="section">
			<dl class="dl">
				
					<dt class="dt dlterm">原因</dt>

					<dd class="dd">
					<p class="p">IPv6的IP地址格式有误。</p>

					</dd>

				
				
					<dt class="dt dlterm">解决方案</dt>

					<dd class="dd">
						<p class="p">输入正确格式的IP地址。</p>

						<p class="p">xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx:xxxx中每个xxxx的值需在从0到ffff的范围内。</p>

						<p class="p">请确认以下项目，然后重试。</p>

							<ul class="ul">
								<li class="li"><p class="p">已在输入栏中输入了十六进制的数值</p>
</li>

								<li class="li"><p class="p">使用缩略形式（::）不超过两次</p>
</li>

								<li class="li"><p class="p">输入栏中没有空白</p>
</li>

							</ul>

					</dd>

				
			</dl>

		</div>

	</div>
